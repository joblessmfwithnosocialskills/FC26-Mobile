<!DOCTYPE html>
<html>
<head>
<title>FC26 Mobile Installer</title>
<style>
body { font-family: Arial; text-align: center; margin-top: 80px; }
progress { width: 300px; height: 25px; }
</style>
</head>
<body>

<h1>Installing FC26...</h1>
<progress id="bar" max="100" value="0"></progress>
<p id="text">0%</p>

<script>
let p = 0;
const bar = document.getElementById("bar");
const text = document.getElementById("text");

const i = setInterval(() => {
  p += 5;
  bar.value = p;
  text.textContent = p + "%";

  if (p >= 100) {
    clearInterval(i);
    window.location.href = "https://youtu.be/dQw4w9WgXcQ";
  }
}, 200);
</script>

</body>
</html>
